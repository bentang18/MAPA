[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008", "B905", "UP035"]

[tool.ruff.lint.per-file-ignores]
"evals/figures/*.py" = ["E402"]   # matplotlib.use("Agg") must precede the pyplot import
"hubconf.py" = ["F401"]
"mapa/__init__.py" = ["F401"]
"mapa/models/__init__.py" = ["F401"]
"mapa/data/__init__.py" = ["F401"]
"mapa/probe/__init__.py" = ["F401"]
"mapa/hub/__init__.py" = ["F401"]
