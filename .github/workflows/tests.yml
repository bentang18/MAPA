name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            torch: 'torch==2.6.0'
          - python: '3.12'
            torch: 'torch>=2.6'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU PyTorch and package
        run: |
          python -m pip install '${{ matrix.torch }}' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test,preprocessing]' ruff build
      - run: python -m ruff check .
      - run: python -m pytest -ra
      - run: python -m build
